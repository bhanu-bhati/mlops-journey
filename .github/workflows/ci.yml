name: MLOps Pipeline CI

on:
  push:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    
    # FIX: Force the GitHub Actions runner to execute using modern Node 24
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Check out your repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install required dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas scikit-learn evidently

    - name: Execute Automated Data Drift Check
      run: |
        python monitor_drift.py

